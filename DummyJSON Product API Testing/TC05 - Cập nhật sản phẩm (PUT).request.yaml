$kind: http-request
description: Cập nhật thông tin cho sản phẩm theo productId.
url: "{{baseUrl}}/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Sản Phẩm Đã Cập Nhật Tên",
      "price": 999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code phải là 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Tiêu đề và giá đã được cập nhật thành công", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.title).to.eql("Sản Phẩm Đã Cập Nhật Tên");
          pm.expect(jsonData.price).to.eql(999);
      });
    language: text/javascript
order: 5000
